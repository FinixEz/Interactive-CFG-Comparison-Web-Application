services:
  - type: web
    name: Interactive-CFG-Comparison-Web-Application
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements-production.txt
    startCommand: gunicorn --chdir webapp --bind 0.0.0.0:$PORT --timeout 120 --workers 2 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true

