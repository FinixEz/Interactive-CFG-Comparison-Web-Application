services:
  cfg-webapp:
    build: .
    container_name: cfg-webapp
    # NOTE: Docker-published ports bypass ufw. Local-only by default;
    # set BIND_ADDR=0.0.0.0 (e.g. in .env) to expose the app to the LAN.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
    restart: unless-stopped
